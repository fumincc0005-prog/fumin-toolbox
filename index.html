<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <!-- 【資安】CSP：只允許載入本網站自己的程式，禁止內嵌／外部腳本、eval、外送資料 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>富民營造工具箱</title>
  <meta name="theme-color" content="#0b3c78" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="富民工具箱" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/plan-notes.css" />
</head>
<body>
  <!-- 富民營造工具箱（離線版，改自酪梨營造工具箱）：資料只存在這台裝置，不需網路與伺服器 -->

  <!-- 封面：開啟 App 先看到這頁；工具入口＋最新更新 -->
  <section class="cv" id="cover" hidden>
    <div class="cv-hero">
      <img class="cv-logo" src="icons/logo-fumin.svg" alt="富民營造標誌：安全帽與打勾" />
      <h1 class="cv-name">富民營造工具箱</h1>
      <p class="cv-tag">工地隨身工具・沒有網路也能用</p>
    </div>
    <div class="cv-tools">
      <a class="cv-tool" href="#/self-check">
        <img src="icons/icon.svg" alt="" width="48" height="48" />
        <span><b>自主檢查表</b><small>施工自主檢查・手寫簽名・PDF 列印</small></span>
        <i aria-hidden="true">›</i>
      </a>
      <a class="cv-tool" href="#/plan-notes">
        <span class="cv-tool-emoji" aria-hidden="true">🗺</span>
        <span><b>平面圖巡查筆記</b><small>在平面圖上點位置記問題・照片・追蹤改善</small></span>
        <i aria-hidden="true">›</i>
      </a>
      <div class="cv-tool cv-soon" aria-disabled="true">
        <span class="cv-soon-icon" aria-hidden="true">＋</span>
        <span><b>更多工具開發中</b><small>敬請期待</small></span>
      </div>
    </div>
    <section class="cv-news" id="cvNews" hidden>
      <h2>📢 最新更新</h2>
      <div id="cvNewsList"></div>
      <button class="cv-more" id="cvNewsMore" hidden>查看全部更新</button>
    </section>
    <p class="cv-foot">資料只存在這台裝置 ・ 換手機前請先備份</p>
  </section>

  <header class="ol-bar" id="olBar" hidden>
    <a class="ol-brand" href="#/" title="回到封面">
      <img src="icons/logo-fumin.svg" alt="" width="30" height="34" />
      <div>
        <div class="ol-title">自主檢查表</div>
        <div class="ol-sub">富民營造工具箱</div>
      </div>
    </a>
    <label class="ol-project">
      <span>工地：</span>
      <select id="olProject" aria-label="目前工地"></select>
    </label>
    <button class="ol-btn" id="olManage" title="公司名稱；新增、改名、刪除工地">✎ 工地</button>
    <button class="ol-btn" id="olBackup" title="匯出或匯入備份">💾 備份</button>
    <span class="ol-status" id="olStatus" hidden></span>
  </header>
  <div class="ol-remind" id="olRemind" hidden>
    <span id="olRemindText"></span>
    <button class="ol-btn" data-remind="backup">💾 立即備份</button>
    <button class="ol-remind-later" data-remind="later">稍後</button>
  </div>

  <main class="ol-content" id="content" hidden><div class="sk-empty">載入中…</div></main>

  <dialog class="sk-dialog pj-dialog" id="olDialog"></dialog>
  <dialog class="sk-dialog tp-dialog" id="olTpl"></dialog>
  <input type="file" id="olImportFile" accept=".json,application/json" hidden />

  <script src="js/boot.js"></script>
  <script src="offline-store.js"></script>
  <script src="js/pages/self-check-print.js"></script>
  <script src="js/pages/self-check-guides.js"></script>
  <script src="js/pages/self-check.js"></script>
  <script src="js/pages/plan-notes.js"></script>
  <script src="js/app-shell.js"></script>
</body>
</html>
